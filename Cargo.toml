[package]
name = "iot-power-tui"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "A terminal application for IoT Power CC USB measurements, charts, and SQLite capture"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
crossterm = "0.28"
ratatui = "0.29"
rusb = { version = "0.9", features = ["vendored"] }
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serialport = { version = "4", default-features = false }
chrono = { version = "0.4", features = ["serde"] }

tempfile = "3"
